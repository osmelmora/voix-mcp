name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto follows the commits since the last tag)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: Exact version X.Y.Z instead of the bump (optional)
        type: string
      dry_run:
        description: Build and test the release, then stop before publishing
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail. The implicit shell is bash -e, where a failed
    # `git ls-remote ... | cut -f1` yields an empty string instead of failing.
    shell: bash

# Runs that can release (pushes to main, dispatches from main) run one at a
# time, in order, and are never cancelled. `queue: max` keeps up to 100 pending
# runs instead of GitHub's default of one, where a newer pending run replaces
# the older one and can drop a release or a requested bump. Dry runs never
# push, so they wait in their own group. Pull requests and dispatches from
# other branches get a group per run and run in parallel, as before.
concurrency:
  group: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && format('ci-run-{0}', github.run_id) || (inputs.dry_run && 'ci-dry-run' || 'ci-release') }}
  queue: max # actionlint does not know this key yet; see .github/actionlint.yaml
  cancel-in-progress: false # queue: max does not allow true

jobs:
  # Next release version from the commits since the last tag; empty when
  # nothing calls for a bump, which leaves a plain CI run.
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      publish: ${{ steps.next.outputs.publish }}
    steps:
      - if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases run from main, not $GITHUB_REF_NAME"
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cog reads the commits since the last tag
      - uses: jdx/mise-action@v4
      - id: next
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$VERSION" ]; then
            if ! [[ $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::version must be a stable X.Y.Z, not '$VERSION'"
              exit 1
            fi
            current=$(cog get-version)
            highest=$(printf '%s\n' "$current" "$VERSION" | sort -V | tail -n 1)
            if [ "$VERSION" = "$current" ] || [ "$highest" != "$VERSION" ]; then
              echo "::error::version $VERSION is not greater than the current $current"
              exit 1
            fi
            set -- --version "$VERSION"
          else
            set -- "--${BUMP:-auto}"
          fi
          # Prints the next tag, or a "No conventional commits ..." notice when
          # nothing since the last tag calls for a bump; exits 0 either way.
          out=$(cog bump --dry-run "$@")
          if [[ $out == "No conventional commits"* ]]; then
            echo "Nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! [[ $out =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected output from cog bump --dry-run: $out"
            exit 1
          fi
          echo "tag=$out" >> "$GITHUB_OUTPUT"
          echo "version=${out#v}" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: would release $out." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $out if both platforms pass." >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    name: check (${{ matrix.target }})
    needs: plan
    # Pull requests skip plan.
    if: ${{ !cancelled() && needs.plan.result != 'failure' }}
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cog check reads the commits since the last tag
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: echo "VOIX_HOME=$RUNNER_TEMP/voix" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: ${{ env.VOIX_HOME }}/models
          key: kokoro-${{ runner.os }}-${{ hashFiles('src/providers/kokoro/model.ts') }}
      - run: cog check
      - run: hk check --all
      # The build bakes the version from package.json into the binary. The
      # release job commits the same version with cog bump.
      - if: needs.plan.outputs.version != ''
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bun pm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: bun run build bun-${{ matrix.target }}
      - run: bun run scripts/smoke.ts ./dist/voix-${{ matrix.target }}
      - run: VOIX_PLAYER=none VOIX_BIN=./dist/voix-${{ matrix.target }} bun test
      - if: needs.plan.outputs.version != ''
        uses: actions/upload-artifact@v6
        with:
          name: voix-${{ matrix.target }}
          path: dist/voix-${{ matrix.target }}
          if-no-files-found: error

  # Both platforms passed with the planned version: commit the bump on the
  # tested commit, tag it, and publish the binaries built above. Pushes made
  # with GITHUB_TOKEN start no workflow runs.
  release:
    needs: [plan, check]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump commit and tag, publish the release
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cog needs tags and history for the bump and the release notes
      - uses: jdx/mise-action@v4
      - id: state
        run: |
          main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          tag=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$tag" ] && [ "$(git rev-parse --verify "$TAG^{commit}^")" = "$GITHUB_SHA" ] &&
            [ "$(git log -1 --format=%s "$TAG")" = "chore(version): $TAG" ]; then
            # An earlier attempt pushed this bump, then failed to publish.
            echo "next=publish" >> "$GITHUB_OUTPUT"
          elif [ "$main" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved past this commit; the run for the newer commit releases."
          elif [ -n "$tag" ]; then
            echo "::error::$TAG already exists and is not the bump of $GITHUB_SHA"
            exit 1
          else
            echo "next=bump" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.state.outputs.next == 'bump'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cog bump --version "$VERSION"
      - if: steps.state.outputs.next == 'bump'
        id: push
        run: |
          # Atomic, so a rejected main cannot leave the tag behind.
          if git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$main" = "$GITHUB_SHA" ]; then
            exit 1 # rejected for a reason other than a moved main
          fi
          echo "::notice::main moved during the release; the run for the newer commit releases."
      - if: steps.state.outputs.next == 'publish' || steps.push.outputs.pushed == 'true'
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ "$remote" != "$(git rev-parse --verify "refs/tags/$TAG")" ] ||
            [ "$(git rev-parse --verify "$TAG^{commit}^")" != "$GITHUB_SHA" ]; then
            echo "::error::origin's $TAG is not the bump of $GITHUB_SHA"
            exit 1
          fi
          # cog changelog --at only gives the right notes with HEAD at the tag.
          git checkout --quiet --detach "$TAG"
          cog changelog --at "$TAG" > RELEASE_NOTES.md
          # Latest unless a newer stable release is already published, so a late
          # re-run of an older release cannot take latest from it. Pushed tags
          # without a published release do not count.
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          newest=$(printf '%s\n%s\n' "$published" "$TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "latest=$([ "$newest" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.prepare.outcome == 'success'
        uses: actions/download-artifact@v7
        with:
          pattern: voix-*
          path: dist
          merge-multiple: true
      - if: steps.prepare.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          make_latest: ${{ steps.prepare.outputs.latest }}
          fail_on_unmatched_files: true
          files: |
            dist/voix-darwin-arm64
            dist/voix-linux-x64
            scripts/install.sh
