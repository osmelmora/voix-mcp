name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cog check reads the commits since the last tag
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: cog check
      - run: hk check --all
      - run: VOIX_PLAYER=none bun test
