name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cog needs tags and history for the release notes
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: hk check --all
      - run: VOIX_PLAYER=none bun test
      - run: bun run build
      - run: ./dist/voix-darwin-arm64 status
      - run: cog changelog --at "$GITHUB_REF_NAME" > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/voix-darwin-arm64
            scripts/install.sh
          body_path: RELEASE_NOTES.md
