name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cog needs tags and history for the release notes
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: echo "VOIX_HOME=$RUNNER_TEMP/voix" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: ${{ env.VOIX_HOME }}/models
          key: kokoro-${{ runner.os }}-${{ hashFiles('src/providers/kokoro/model.ts') }}
      - run: cog check
      - run: hk check --all
      - run: VOIX_PLAYER=none bun test
      - run: bun run build bun-${{ matrix.target }}
      - run: bun run scripts/smoke.ts ./dist/voix-${{ matrix.target }}
      - run: VOIX_PLAYER=none VOIX_BIN=./dist/voix-${{ matrix.target }} bun test tests/mcp.test.ts
      - uses: actions/upload-artifact@v6
        with:
          name: voix-${{ matrix.target }}
          path: dist/voix-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - uses: actions/download-artifact@v7
        with:
          pattern: voix-*
          path: dist
          merge-multiple: true
      - run: cog changelog --at "$GITHUB_REF_NAME" > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/voix-darwin-arm64
            dist/voix-linux-x64
            scripts/install.sh
          body_path: RELEASE_NOTES.md
