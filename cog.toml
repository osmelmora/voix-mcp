# Conventional Commits, changelog, and releases: https://docs.cocogitto.io
tag_prefix = "v"
branch_whitelist = ["main"]
ignore_merge_commits = true
from_latest_tag = true

# The app reads its version from package.json; keep it in step with the tag.
pre_bump_hooks = ["bun pm version {{version}} --no-git-tag-version"]
post_bump_hooks = []

[changelog]
path = "CHANGELOG.md"
template = "default"
authors = []
