# Conventional Commits, changelog, and releases: https://docs.cocogitto.io
tag_prefix = "v"
branch_whitelist = ["main"]
ignore_merge_commits = true
from_latest_tag = true

# The app reads its version from package.json; keep it in step with the tag.
pre_bump_hooks = [
  "bun pm version {{version}} --no-git-tag-version --allow-same-version",
]
post_bump_hooks = []

# Defaults: feat → minor, fix → patch, breaking → minor while on 0.x.
[commit_types]
perf = { bump_patch = true }
# Kept out of the changelog and the release notes, including the
# chore(version) bump commit itself.
ci = { omit_from_changelog = true }
chore = { omit_from_changelog = true }
style = { omit_from_changelog = true }
test = { omit_from_changelog = true }

[changelog]
path = "CHANGELOG.md"
template = "default"
authors = []
